name: Teste Motor V2

on:
  workflow_dispatch: # Este é o comando mágico que cria o botão "Run workflow" para testes manuais

jobs:
  run-v2:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código (Ler ficheiros)
        uses: actions/checkout@v4
        
      - name: Configurar o Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar as Bibliotecas Financeiras
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta
          
      - name: Ligar o Motor V2
        run: python agente_trading_v2.py
