name: 06 Motor Fast Trend Carver + IA Predador

on:
  schedule:
    # Corre de segunda a sexta às 14:00 UTC (Aproximadamente 15:00 em Lisboa)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Permite execução manual a qualquer momento no GitHub

jobs:
  executar_fluxo_carver:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer Checkout do Código
      uses: actions/checkout@v3

    - name: Configurar o Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências (Python e Google GenAI)
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance pandas_ta numpy requests google-genai

    - name: Instalar Dependências Matemáticas e de Rede
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance numpy requests google-genai
        pip install git+https://github.com/twopirllc/pandas-ta.git

    - name: 1. Executar o Motor Matemático Carver (06_motor_fast_trend_carver.py)
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python 06_motor_fast_trend_carver.py

    - name: 2. Executar o Agente Orquestrador IA (Gemini Audit)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        # Substitui '00_orquestrador_ia.py' pelo nome exato do teu script do Agente AI se for diferente
        python 02_agente_gemini.py
