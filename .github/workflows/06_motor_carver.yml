name: 06 Motor Fast Trend Carver (Aceleração)

on:
  schedule:
    # Corre de segunda a sexta às 14:00 UTC (Aproximadamente 15:00 em Lisboa)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Este comando permite-te ir ao GitHub e clicar no botão "Run workflow" para forçar uma execução manual a qualquer momento!

jobs:
  executar_motor_carver:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer Checkout do Código
      uses: actions/checkout@v3

    - name: Configurar o Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências Matemáticas e de Rede
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance pandas_ta numpy requests

    - name: Disparar o Caçador Carver (06_motor_fast_trend_carver.py)
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python 06_motor_fast_trend_carver.py
