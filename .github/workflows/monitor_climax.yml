name: 13 - 🌪️ Monitor Intradiário de Exaustão Climática

on:
  schedule:
    # Executa às 14:30, 16:30, 18:30 e 20:30 UTC de Segunda a Sexta (Mercado US)
    - cron: '30 14,16,18,20 * * 1-5'
  workflow_dispatch: # Permite disparo manual

jobs:
  run-parabolic-shield:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4
        
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests
          
      - name: 🚨 Executar Motor 13 - Exaustão Climática
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 13_motor_exaustao_climatica.py
