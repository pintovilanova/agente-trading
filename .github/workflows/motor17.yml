name: TESTE 19⚡ Pipeline Tática - Hit and Run

on:
  schedule:
    # Executa de Segunda a Sexta às 21:15 (Hora de Lisboa / 21:15 UTC no Inverno)
    - cron: '15 21 * * 1-5'
  workflow_dispatch: # Permite execução manual no GitHub

jobs:
  run-rsi-rebound-engine:
    name: ⚙️ Execução Pipeline Hit & Run (M17 + M18 + M19)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Fazer o Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          pip install pandas-ta==0.4.71b0
          pip install google-generativeai google-genai

      - name: 🗜️ 19 - Executar Motor Squeeze Breakout
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_BOT_TOKEN_GERAL: ${{ secrets.TELEGRAM_BOT_TOKEN_GERAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python 19_motor_squeeze_breakout.py

      - name: 🤖 09 - Orquestrador IA (Síntese Final)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_BOT_TOKEN_GERAL: ${{ secrets.TELEGRAM_BOT_TOKEN_GERAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python 09_agente_gemini_orquestrador.py
