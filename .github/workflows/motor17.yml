name: 17 - ⚡ Motor RSI Drop & Rebound (Swing)

on:
  # 1. Permite testar e executar manualmente a qualquer momento
  workflow_dispatch:
  
  # 2. Agendamento Automático (Golden Window - 20 minutos antes do fecho de Wall St)
  schedule:
    # 🕒 HORÁRIO DE INVERNO: Corre às 20h40 (Novembro a Março)
    - cron: '40 20 * * 1-5'
    
    # ☀️ NOTA PARA O VERÃO: 
    # Quando a hora mudar no final de março, deves vir aqui alterar o cron para:
    # - cron: '40 19 * * 1-5' (que será 19h40 UTC = 20h40 em Portugal)

jobs:
  run-rsi-rebound-engine:
    name: ⚙️ Execução Motor 17 Isolada
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Fazer o Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests google-generativeai google-genai
          pip install pandas-ta==0.4.71b0

      - name: ⚡ Executar Motor 17 (RSI Drop & Rebound)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 17_motor_rsi_drop_rebound.py

      - name: 🤖 Executar Agente IA Orquestrador (Auditoria e Envio de E-mail)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python 09_agente_gemini_orquestrador.py
