name: ⚡ Motor 17 - RSI Drop & Rebound (Swing)

on:
  workflow_dispatch: # Execução manual no GitHub Actions

jobs:
  run-motor17:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests
          pip install https://github.com/twopirllc/pandas-ta/archive/refs/heads/main.zip

      - name: 🚀 Executar Motor 17
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 17_motor_rsi_drop_rebound.py

      - name: 📄 Guardar Relatório Temporário
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-motor-17
          path: comboio_rsi_rebound_temp.txt
          retention-days: 5
