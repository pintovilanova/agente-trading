name: 17 - ⚡ Motor RSI Drop & Rebound (Swing)

on:
  # Permite testar e executar manualmente a qualquer momento no GitHub
  workflow_dispatch:

jobs:
  run-rsi-rebound-engine:
    name: ⚙️ Execução Motor 17 Isolada
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Fazer o Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests google-generativeai google-genai
          pip install https://github.com/twopirllc/pandas-ta/archive/refs/tags/v0.3.14b0.zip

      - name: ⚡ Executar Motor 17 (RSI Drop & Rebound)
        env:
          # Credenciais seguras guardadas no GitHub Secrets
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 17_motor_rsi_drop_rebound.py

      - name: 🤖 Executar Agente IA Orquestrador (Auditoria e Envio de E-mail)
        env:
          # O Orquestrador vai ler o ficheiro comboio_rsi_rebound_temp.txt gerado no passo anterior
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python 09_agente_gemini_orquestrador.py
