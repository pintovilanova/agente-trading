name: Pipeline Trading Europa

on:
  schedule:
    - cron: '0 6 * * 1-5' # Corre de 2ª a 6ª feira às 06:00 UTC
  workflow_dispatch: # Permite correr o teste manualmente a partir do GitHub

jobs:
  executar-pipeline-europa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar as Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests

      - name: Passo 1 - Executar Motor Europa (Extrator + Sheets + E-mail Plano B)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 01_extrator_europa.py
