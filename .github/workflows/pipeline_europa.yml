name: 01 - 🇪🇺 Extrator Europa (Extração do mercado europeu)

on:
  workflow_dispatch: # Permite executar manualmente no GitHub
  schedule:
    # Executa de segunda a sexta-feira às 16:30 UTC (ajusta o cron conforme a tua preferência horária)
    - cron: '30 18 * * 1-5'

jobs:
  executar-pipeline-europa:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pandas-ta requests google-genai

    - name: Passo 1 - Executar Extrator Matemático (Europa)
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python 01_extrator_europa.py

    - name: Passo 2 - Executar Agente IA (Gemini Unificado)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python 02_agente_gemini.py
