name: 🚀 Pipeline Diária de Trading Institucional

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch: 

jobs:
  execucao-diaria:
    name: ⚙️ Operação e Auditoria
    runs-on: ubuntu-latest
    
    steps:
      - name: Aceder ao Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Todas as Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests google-generativeai

      # ==========================================================
      # 1. PORTÃO DE SEGURANÇA (Se falhar, PARA TUDO intencionalmente)
      # ==========================================================
      - name: 🛡️ 00 - Executar Disjuntor Macro
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 00_motor_regime_mercado.py

      # ==========================================================
      # 2. EXTRATORES (Com tolerância a falhas)
      # ==========================================================
      - name: 📥 01 - Executar Extrator US
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python 01_extrator_dados.py

      - name: 📥 01 - Executar Extrator Europa
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python 01_extrator_europa.py

      # ==========================================================
      # 3. MOTORES DE ESTRATÉGIA (Com tolerância a falhas)
      # ==========================================================
      - name: 🚀 07 - Executar Motor Breakout
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 07_motor_vcp_breakout.py

      - name: 🩸 03 - Executar Motor Mean Reversion (Pânico)
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 03_motor_mean_reversion.py

      - name: 📉 05 - Executar Motor Reversão Chan
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 05_motor_reversao_chan.py

      - name: 📈 04 - Executar Motor Earnings Drift (PEAD)
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 04_motor_earnings_drift.py

      - name: ⚡ 06 - Executar Motor Fast Trend Carver
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 06_motor_fast_trend_carver.py

      # ==========================================================
      # 4. AUDITORIA FINAL IA (Corre e envia o que foi recolhido)
      # ==========================================================
      - name: 🤖 09 - Executar Agente IA Orquestrador
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: python 09_agente_gemini_orquestrador.py
