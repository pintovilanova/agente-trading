name: Pipeline Completo de Trading

on:
  schedule:
    - cron: '30 8 * * 1-5' # Dias úteis às 08:30 UTC
  workflow_dispatch: # Permite execução manual a partir do GitHub

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar as Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests
          pip install -r requirements.txt

      - name: Passo 1 - Ligar o Motor V2
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python agente_trading_v2.py

      - name: Pausa curta (Garantir receção do email)
        run: sleep 10

      - name: Passo 2 - Executar o Agente Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ASSUNTO_DO_EMAIL: ${{ secrets.ASSUNTO_DO_EMAIL }}
        run: python agente_trading_git.py
