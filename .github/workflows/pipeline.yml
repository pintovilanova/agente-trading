name: Pipeline Completo de Trading

on:
  schedule:
    - cron: '30 4 * * 1-5'
  workflow_dispatch: # Permite execução manual a partir do GitHub

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar as Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ===================================================================
      # PASSO 0 - O DISJUNTOR MACRO (Se falhar, aborta o pipeline todo)
      # ===================================================================
      - name: Passo 0 - Disjuntor Macro (Regime de Mercado)
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 00_motor_regime_mercado.py

      # ===================================================================
      # PASSO 1 - Ligar o Motor V2 (Breakouts)
      # ===================================================================
      - name: Passo 1 - Ligar o Motor V2
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 01_extrator_dados.py

      # ===================================================================
      # PASSO 2 - Executar o Agente Python
      # ===================================================================
      - name: Passo 2 - Executar o Agente Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ASSUNTO_DO_EMAIL: ${{ secrets.ASSUNTO_DO_EMAIL }}
        run: python 02_agente_gemini.py
