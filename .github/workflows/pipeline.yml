name: Pipeline Completo de Trading (Modular)

on:
  schedule:
    - cron: '30 4 * * 1-5' # Dias úteis às 08:30 UTC
  workflow_dispatch: # Permite execução manual a partir do GitHub

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests google-generativeai
          pip install pandas-ta-quant

      - name: Passo 1 - Executar Motor Matemático (Gera Dados e Envia Email Base)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python agente_trading_v2.py

      - name: Pausa curta (Garantir receção do email)
        run: sleep 10

      - name: Passo 2 - Executar Agente de IA (Lê a caixa, corre o Gemini e gera Relatório)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python agente_tading_git.py
