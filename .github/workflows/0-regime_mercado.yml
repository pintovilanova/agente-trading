name: 🛡️⚡ 00 - Motor de Regime de Mercado (Macro)

on:
  schedule:
    # Executa de segunda a sexta-feira às 21:00 UTC
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite executar manualmente a partir do botão no GitHub

jobs:
  executar-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Aceder ao Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests

      - name: Executar Disjuntor Macro
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python 00_motor_regime_mercado.py
