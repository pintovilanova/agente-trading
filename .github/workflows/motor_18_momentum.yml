name: 18 - 🚀Motor Momentum Burst (Hit and Run)

on:
  schedule:
    # Executa de Segunda a Sexta às 21:15 (Hora de Lisboa / 21:15 UTC no Inverno)
    - cron: '15 21 * * 1-5'
  workflow_dispatch: # Permite execução manual no GitHub

jobs:
  run-rsi-rebound-engine:
    name: ⚙️ Execução Motor 17 Isolada
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Fazer o Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          pip install pandas-ta==0.4.71b0

      - name: Executar Motor 18
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_BOT_TOKEN_GERAL: ${{ secrets.TELEGRAM_BOT_TOKEN_GERAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python 18_motor_momentum_burst.py
