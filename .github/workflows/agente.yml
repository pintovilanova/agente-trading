name: Agente Tático de Trading

on:
  workflow_dispatch:  # Permite chamadas manuais e via API REST
  schedule:
    - cron: '45 4 * * *' # Podes manter como plano de fundo, se quiseres

jobs:
  executar-agente:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Agente Python
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        ASSUNTO_DO_EMAIL: ${{ secrets.ASSUNTO_DO_EMAIL }}
      run: |
        python agente_trading_git.py
