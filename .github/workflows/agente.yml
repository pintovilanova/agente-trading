name: Agente Tático de Trading

on:
  workflow_dispatch:  # Permite chamadas manuais no separador "Actions" do GitHub
  # schedule:
  #   - cron: '30 4 * * 1-5' # Desativado: Deixou de correr automaticamente em dias úteis

jobs:
  executar-agente:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Agente Python Único
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python agente_trading_unico.py
