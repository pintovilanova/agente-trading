name: 08 - 🏹 Motor Reversão (Connors)

on:
  # 1. Permite executar o script manualmente a qualquer momento (Botão "Run workflow")
  workflow_dispatch:

  # 2. Execução Automática (Cron Job): 
  # Executa de Segunda a Sexta às 22:30 UTC (Pós-fecho de Wall Street)
  schedule:
    - cron: '30 22 * * 1-5'

jobs:
  run-reversao-engine:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Fazer o Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests google-genai

      - name: ⚙️ Executar Motor Mean Reversion (Larry Connors)
        env:
          # Segredos necessários para descarregar a Watchlist e enviar o email temporário
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 08_motor_reversao_connors.py

      - name: 🤖 Executar Agente IA (Relatório Final)
        env:
          # O Agente IA assume a pasta local, lê o ficheiro 'comboio_connors_temp.txt' e envia-te o briefing
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python 02_agente_gemini.py
